name: Build NetPulse.exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: >
          python -m PyInstaller --noconfirm --clean --onefile --name NetPulse
          --add-data "static;static" --collect-submodules aiohttp --collect-submodules scapy app.py
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist\NetPulse.exe -ArgumentList "--no-browser" -PassThru
          Start-Sleep 8
          (Invoke-WebRequest http://127.0.0.1:8080/health).Content
          Stop-Process $p
      - uses: actions/upload-artifact@v4
        with:
          name: NetPulse-windows
          path: dist/NetPulse.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NetPulse.exe
